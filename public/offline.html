<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Evolute Wallet Offline</title>
    <style>
      :root {
        color-scheme: dark;
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #0a0a0a;
        color: #ffffff;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      }
      main {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
      }
      section {
        width: 100%;
        max-width: 420px;
        border: 1px solid rgba(255, 255, 255, 0.16);
        border-radius: 20px;
        padding: 20px;
        background: rgba(255, 255, 255, 0.04);
      }
      h1 {
        margin: 0 0 8px;
        font-size: 1.2rem;
      }
      p {
        margin: 0;
        color: rgba(255, 255, 255, 0.74);
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <main>
      <section>
        <h1>No internet connection</h1>
        <p>Reconnect to load your wallet balance and transaction status.</p>
      </section>
    </main>
  </body>
</html>
